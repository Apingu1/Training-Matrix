name: Training Matrix CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: training_matrix_ci
          POSTGRES_USER: training_matrix
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training_matrix -d training_matrix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff format --check api
      - run: ruff check api
      - run: pytest -q api/tests
      - run: pip-audit -r api/requirements.txt
      - run: bash -n run_stack.sh scripts/*.sh
      - working-directory: api
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://training_matrix:ci-database-password@localhost:5432/training_matrix_ci
          JWT_SECRET: ci-jwt-secret-with-more-than-thirty-two-characters
          INITIAL_ADMIN_PASSWORD: CI-Initial-Admin-Password1!
          DOCUMENT_ROOT: /tmp/controlled-documents
          BACKUP_ROOT: /tmp/training-backups
          DOCUMENT_CACHE_ROOT: /tmp/training-cache
          RUNTIME_ROOT: /tmp/training-runtime
        run: alembic upgrade head
      - env:
          DATABASE_URL: postgresql://training_matrix:ci-database-password@localhost:5432/training_matrix_ci
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("INSERT INTO audit_events (event_type, success, created_at) VALUES ('CI_APPEND_ONLY', true, now()) RETURNING id")
                  event_id = cursor.fetchone()[0]
                  try:
                      cursor.execute("UPDATE audit_events SET event_type = 'MUTATED' WHERE id = %s", (event_id,))
                  except psycopg.errors.RaiseException:
                      connection.rollback()
                  else:
                      raise SystemExit("Append-only audit trigger did not reject mutation")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm audit --omit=dev
      - working-directory: web
        run: npm run build
      - name: Build production web image from its isolated Docker context
        run: docker build --tag eaststone-training-matrix-web-ci web

  windows-script-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell administration scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }
      - name: Verify Windows installer and detached Compose contract
        shell: pwsh
        run: ./scripts/windows_install_contract_test.ps1

  commercial-package:
    name: Build validated commercial package
    runs-on: ubuntu-latest
    needs: [backend, frontend, windows-script-syntax]
    steps:
      - uses: actions/checkout@v4
      - name: Build clean commercial package
        run: ./scripts/build_commercial_package.sh
      - name: Validate package contents and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          package='release/artifact-staging/Eaststone Training Matrix'
          required=(
            '00 - START HERE - INSTALLATION GUIDE.txt'
            '01 - INSTALL SERVER.bat'
            '02 - START SERVER.bat'
            '03 - STOP SERVER.bat'
            '04 - SERVER STATUS.bat'
            '05 - UPDATE SERVER.bat'
            '06 - CONFIGURE DOCUMENT FOLDER.bat'
            '07 - RESET ADMIN PASSWORD.bat'
            'UNINSTALL SERVER - KEEP DATA.bat'
            'DANGER - COMPLETE UNINSTALL DELETE DATABASE.bat'
            'CLIENT DEPLOYMENT/01 - INSTALL CLIENT.bat'
            'CLIENT DEPLOYMENT/client_setup.ps1'
            'Documentation/INSTALLATION.md'
            'Documentation/SECURITY_AND_VALIDATION.md'
            'System/APP_VERSION'
            'System/api/Dockerfile'
            'System/api/app/main.py'
            'System/api/app/services/source_discovery.py'
            'System/api/alembic.ini'
            'System/api/alembic/versions/0002_source_inventory.py'
            'System/infra/docker-compose.yml'
            'System/web/Dockerfile'
            'System/web/package-lock.json'
            'System/web/src/pages/SourceDiscoveryPage.tsx'
            'System/windows/install.ps1'
            'PACKAGE_INFORMATION.txt'
            'PACKAGE_MANIFEST_SHA256.txt'
          )
          for item in "${required[@]}"; do
            test -e "$package/$item" || { echo "Missing commercial package item: $item" >&2; exit 1; }
          done
          forbidden=(
            'System/api/tests'
            'System/api/requirements-dev.txt'
            'System/api/pytest.ini'
            'System/web/node_modules'
            'System/web/dist'
            'System/.env'
            'run_stack.sh'
            '.github'
          )
          for item in "${forbidden[@]}"; do
            test ! -e "$package/$item" || { echo "Forbidden development item in package: $item" >&2; exit 1; }
          done
          if find "$package" -type f \( -name '*.dump' -o -name '*.sqlite' -o -name 'server.key' -o -name '.env' \) -print -quit | grep -q .; then
            echo 'A data, credential or private-key file leaked into the package.' >&2
            exit 1
          fi
          if find "$package" -type d -name '__pycache__' -print -quit | grep -q . || find "$package" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo 'A Python runtime cache leaked into the commercial package.' >&2
            exit 1
          fi
          (cd "$package" && sha256sum --check PACKAGE_MANIFEST_SHA256.txt)
          unzip -t release/Eaststone-Training-Matrix-Commercial-Package.zip
          sha256sum --check release/Eaststone-Training-Matrix-Commercial-Package.zip.sha256
      - name: Upload single-extract commercial package
        id: commercial-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaststone-Training-Matrix-Commercial-Package
          path: release/artifact-staging/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Publish artifact details
        shell: bash
        run: |
          {
            echo '### Eaststone Training Matrix commercial package'
            echo
            echo "[Download validated artifact](${{ steps.commercial-artifact.outputs.artifact-url }})"
            echo
            echo 'SHA-256 artifact digest: `${{ steps.commercial-artifact.outputs.artifact-digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
